<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopping List Privacy / Datenschutz</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f7f7f4;
      --text: #1f2528;
      --muted: #5d666b;
      --link: #2457a7;
      --rule: #d8d8d2;
      --card: rgba(255, 255, 255, 0.65);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #151719;
        --text: #f1f1ec;
        --muted: #b7bcbf;
        --link: #8db5ff;
        --rule: #34383b;
        --card: rgba(255, 255, 255, 0.06);
      }
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 22px 72px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      line-height: 1.2;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
    }

    .links {
      display: grid;
      gap: 12px;
      margin-top: 28px;
    }

    a {
      color: var(--link);
    }

    .button {
      display: block;
      padding: 16px 18px;
      border: 1px solid var(--rule);
      border-radius: 10px;
      background: var(--card);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>Shopping List Privacy / Datenschutz</h1>
    <p>Please choose your language. Bitte wählen Sie Ihre Sprache.</p>

    <div class="links">
      <a class="button" href="privacy-de.html">Deutsch: Datenschutzerklärung</a>
      <a class="button" href="privacy-en.html">English: Privacy Policy</a>
    </div>
  </main>
</body>
</html>
